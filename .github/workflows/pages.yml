name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.161.1
      HUGO_BASEURL: https://cce-li.github.io/CyberBlog/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/hugo"
          tar -C "${HOME}/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/hugo" >> "${GITHUB_PATH}"

      - name: Verify Hugo
        run: hugo version

      - name: Prepare theme
        run: |
          theme_root="${RUNNER_TEMP}/themes/rewired"
          mkdir -p "${theme_root}"
          rsync -a --exclude='.git' --exclude='exampleSite' --exclude='.github' \
            "${GITHUB_WORKSPACE}/" "${theme_root}/"
          echo "HUGO_THEMESDIR=${RUNNER_TEMP}/themes" >> "${GITHUB_ENV}"

      - name: Build site
        run: |
          hugo \
            --source exampleSite \
            --gc \
            --minify \
            --baseURL "${HUGO_BASEURL}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    environment:
      name: github-pages
      url: https://cce-li.github.io/CyberBlog/

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
