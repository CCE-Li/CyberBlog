{{- $dest := .Destination -}}
{{- $src := $dest -}}
{{- $alt := .Text -}}
{{- $title := .Title -}}

{{- with .Page -}}
	{{- with .Resources.GetMatch $dest -}}
		{{- $src = .RelPermalink -}}
	{{- end -}}
{{- end -}}

{{- if .IsBlock -}}
<figure class="content-figure">
	<img
		src="{{ $src | safeURL }}"
		alt="{{ $alt }}"
		{{ with $title }}title="{{ . }}"{{ end }}
		loading="lazy"
	>

	{{ if or $title $alt }}
		<figcaption>
			{{ with $title }}{{ . }}{{ else }}{{ $alt }}{{ end }}
		</figcaption>
	{{ end }}
</figure>
{{- else -}}
<img src="{{ $src | safeURL }}" alt="{{ $alt }}"{{ with $title }} title="{{ . }}"{{ end }}>
{{- end -}}
